name: Vercel Fixed Preview Deploy

on:
  push:
    branches:
      - develop # Altere para a sua branch de preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Recria o link só no runner do CI (não afeta o .vercel da sua máquina)
      - name: Relink Vercel project
        run: rm -rf .vercel

      # A mensagem "remove .vercel" do CLI costuma mascarar 401/403 (token inválido/sem acesso ao team)
      - name: Diagnose Vercel access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN está vazio no GitHub Secrets"
            exit 1
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo "::error::VERCEL_ORG_ID está vazio no GitHub Secrets"
            exit 1
          fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::VERCEL_PROJECT_ID está vazio no GitHub Secrets"
            exit 1
          fi
          echo "ORG_ID length=${#VERCEL_ORG_ID} PROJECT_ID length=${#VERCEL_PROJECT_ID} TOKEN length=${#VERCEL_TOKEN}"
          HTTP_CODE=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          echo "API GET /v9/projects => HTTP ${HTTP_CODE}"
          cat /tmp/vercel-project.json
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Token sem acesso ao projeto/team (ou IDs incorretos). Recrie o token em https://vercel.com/account/tokens escolhendo o scope do team do projeto."
            exit 1
          fi

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --debug

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel and Capture URL
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Assign Fixed Alias
        run: |
          vercel alias set ${{ steps.deploy.outputs.url }} https://sclinic-dev.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
