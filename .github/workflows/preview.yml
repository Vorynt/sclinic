name: Vercel Fixed Preview Deploy

on:
  push:
    branches:
      - develop # Altere para a sua branch de preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Recria o link só no runner do CI (não afeta o .vercel da sua máquina)
      - name: Relink Vercel project
        run: rm -rf .vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel and Capture URL
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Assign Fixed Alias
        run: |
          vercel alias set ${{ steps.deploy.outputs.url }} https://sclinic-dev.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
